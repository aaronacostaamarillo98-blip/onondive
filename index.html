<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oñondive</title>
  <meta name="description" content="Oñondive: acompañamiento entre consultas. Prototipo con datos inventados.">
  <meta name="theme-color" content="#1D3557">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 40'%3E%3Ccircle cx='22' cy='20' r='14' fill='none' stroke='%231D3557' stroke-width='6'/%3E%3Ccircle cx='42' cy='20' r='14' fill='none' stroke='%234FA89C' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Poppins:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/estilos.css?v=10">
</head>
<body>
  <a class="saltar" href="#contenido" data-t="saltar">Ir al contenido</a>

  <header class="barra">
    <a class="marca" href="#/" aria-label="Oñondive, inicio">
      <svg class="logo" viewBox="0 0 64 40" aria-hidden="true">
        <circle cx="22" cy="20" r="14" fill="none" stroke="currentColor" stroke-width="5"/>
        <circle cx="42" cy="20" r="14" fill="none" style="stroke: var(--verde)" stroke-width="5"/>
      </svg>
      <span>Oñondive</span>
    </a>
    <div class="idioma" role="group" aria-label="Idioma / Ñe'ẽ">
      <button type="button" data-idioma="es" aria-pressed="true">Castellano</button>
      <button type="button" data-idioma="gn" aria-pressed="false">Guaraní</button>
    </div>
  </header>

  <aside class="crisis" aria-labelledby="crisis-titulo">
    <p id="crisis-titulo" class="crisis-titulo" data-t="crisisTitulo">¿Necesitás ayuda ahora?</p>
    <div class="crisis-tel">
      <a href="tel:155"><span aria-hidden="true">📞</span> <span data-t="linea155">Línea 155</span></a>
      <a href="tel:911"><span aria-hidden="true">🚨</span> 911</a>
    </div>
    <p class="crisis-nota" data-t="crisisNota">La Línea 155 es gratis y atiende las 24 horas. Esta app no es un servicio de emergencia.</p>
  </aside>

  <main id="contenido" tabindex="-1"></main>

  <footer class="pie">
    <p data-t="pie">Prototipo con datos inventados. Ningún dato es real.</p>
    <button type="button" class="enlace" id="reiniciar" data-t="reiniciar">Reiniciar demo</button>
  </footer>

  <script src="js/textos.js?v=10"></script>
  <script src="js/datos.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
